<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Focus Timer</h1>

        <div class="timer-display">
            <svg class="progress-ring" viewBox="0 0 200 200">
                <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                <circle class="progress-ring-circle" cx="100" cy="100" r="90"/>
            </svg>
            <div class="timer-text">01:00</div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">시작</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>일시정지</button>
            <button id="skipBtn" class="btn btn-secondary" disabled>건너뛰기</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
